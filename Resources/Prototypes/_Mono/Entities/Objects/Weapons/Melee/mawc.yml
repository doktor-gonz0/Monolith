    attackRate: 3
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: DisarmMalus
    malus: 0.6
  - type: EnergySword
    colorOptions:
    - "#FFCF76"
    activatedColor: "#FFCF76"
    blockHacking: true
