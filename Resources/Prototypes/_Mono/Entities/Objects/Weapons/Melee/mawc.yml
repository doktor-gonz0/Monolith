  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: red
  - type: Item
    sprite: _Mono/Objects/Weapons/Melee/MAWCHelcutter.rsi
    size: Normal
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: Execution
      doAfterDuration: 4.0
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
